spring.application.name=ai-logistics-agent

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/logistics_agent}
spring.datasource.username=${DB_USERNAME:logistics_app}
spring.datasource.password=${DB_PASSWORD}

#spring.datasource.username=logistics_app
#spring.datasource.password=Divi@2018
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Local AI model configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:4b

